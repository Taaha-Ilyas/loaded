<script>
'use strict';
const W=1280,H=720;
const cv=document.getElementById('cv');
let X=cv.getContext('2d');
let K=1,DPR=1;
const $=id=>document.getElementById(id);
const FONT='Fredoka, system-ui, sans-serif';

/* ================= UTIL ================= */
const rand=(a,b)=>a+Math.random()*(b-a);
const randi=(a,b)=>Math.floor(rand(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const avg=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:0;
const ease=t=>t<0?0:t>1?1:t*t*(3-2*t);
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hexC={};
function hx(c){if(hexC[c])return hexC[c];let s=c.slice(1);if(s.length===3)s=s.split('').map(ch=>ch+ch).join('');const n=parseInt(s.slice(0,6),16);return hexC[c]=[n>>16&255,n>>8&255,n&255]}
function mix(a,b,t){const A=hx(a),B=hx(b);t=clamp(t,0,1);return `rgb(${A[0]+(B[0]-A[0])*t|0},${A[1]+(B[1]-A[1])*t|0},${A[2]+(B[2]-A[2])*t|0})`}
function hexA(c,a){const[r,g,b]=hx(c);return `rgba(${r},${g},${b},${a})`}
function shade(c,k){return mix(c,'#000000',k)}
function grad(stops,t){if(t<=stops[0][0])return mix(stops[0][1],stops[0][1],0);for(let i=0;i<stops.length-1;i++){if(t<=stops[i+1][0])return mix(stops[i][1],stops[i+1][1],(t-stops[i][0])/(stops[i+1][0]-stops[i][0]))}const l=stops[stops.length-1][1];return mix(l,l,0)}
function money(n){const neg=n<0;n=Math.abs(n);return (neg?'-':'')+'£'+n.toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2})}
function money0(n){return '£'+Math.round(n).toLocaleString('en-GB')}
function fmtClock(m){m=Math.floor(m/5)*5;const h=Math.floor(m/60),mm=m%60;let h12=h%12;if(!h12)h12=12;return h12+':'+String(mm).padStart(2,'0')+(h>=12&&h<24?'pm':'am')}
function hourLabel(h){let h12=h%12;if(!h12)h12=12;return h12+(h>=12?'pm':'am')}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/* ================= DRAW PRIMITIVES ================= */
function rr(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath()}
function frr(x,y,w,h,r,c){rr(x,y,w,h,r);X.fillStyle=c;X.fill()}
function circ(x,y,r,c){X.beginPath();X.arc(x,y,Math.max(0,r),0,Math.PI*2);X.fillStyle=c;X.fill()}
function ell(x,y,rx,ry,c){X.beginPath();X.ellipse(x,y,Math.max(0,rx),Math.max(0,ry),0,0,Math.PI*2);X.fillStyle=c;X.fill()}
function txt(t,x,y,size,col,align='center',weight=600,base='middle'){X.font=`${weight} ${size}px ${FONT}`;X.fillStyle=col;X.textAlign=align;X.textBaseline=base;X.fillText(t,x,y)}
function otxt(t,x,y,size,col,oc='#000',lw=4,align='center',weight=700){X.font=`${weight} ${size}px ${FONT}`;X.textAlign=align;X.textBaseline='middle';X.lineJoin='round';X.strokeStyle=oc;X.lineWidth=lw;X.strokeText(t,x,y);X.fillStyle=col;X.fillText(t,x,y)}
function line(x1,y1,x2,y2,c,w){X.beginPath();X.moveTo(x1,y1);X.lineTo(x2,y2);X.strokeStyle=c;X.lineWidth=w;X.stroke()}
function glow(c,b,fn){X.save();X.shadowColor=c;X.shadowBlur=b;fn();X.restore()}
function dashed(x,y,w,h,r,c){X.save();X.strokeStyle=c;X.lineWidth=3;X.setLineDash([8,6]);X.lineDashOffset=-(R?R.t:0)*30;rr(x,y,w,h,r);X.stroke();X.restore()}

function makeReview(c,walked){
 const L=c.order;let tot=0;for(const l of L)tot+=l.done?(l.q/100*3+l.rar*.4):.5;
 let sc=tot/L.length;const pf=clamp(c.pat/c.maxP,0,1);if(!walked&&pf<.2)sc-=.3;if(walked&&!L.some(l=>l.done))sc=1;
 const stars=clamp(Math.round(sc*2)/2,.5,5);
 const done=L.filter(l=>l.done).sort((a,b)=>b.rar-a.rar||b.q-a.q);
 const best=done[0],worst=done[done.length-1];
 const bn=best?DISHES[best.d].n.toLowerCase():'food',br=best?RAR[best.rar].n.toLowerCase():'',wn=worst?DISHES[worst.d].n.toLowerCase():'food';
 const rn=RS().name;
 let headline,quote;
 if(walked&&!done.length){headline='NEVER EVEN FED';quote=`I waited and waited at ${rn}. Nobody brought me a thing. I left hungry.`}
 else if(stars>=5){headline='A MUST-VISIT!';quote=`The ${bn} was nothing short of ${br}. I would queue all day for it.`}
 else if(stars>=4.5){headline='SENSATIONAL';quote=`${rn} is the real deal — that ${bn} will live in my dreams.`}
 else if(stars>=4){headline='SERIOUSLY GOOD';quote=`A ${br} ${bn}, from a place like this? Believe it.`}
 else if(stars>=3.5){headline='WORTH A STOP';quote=`Well cooked and fairly priced. The ${bn} hit the spot.`}
 else if(stars>=3){headline='DECENT ENOUGH';quote=`Solid, honest food. Nothing that blew me away, but I left full.`}
 else if(stars>=2.5){headline='HIT AND MISS';quote=`Some good ideas, but the ${wn} needed a lot more love.`}
 else if(stars>=2){headline='UNDERWHELMING';quote=`Forgettable. The ${wn} tasted like it had given up.`}
 else{headline='AVOID';quote=`I have had better meals out of a vending machine.`}
 const boost={5:6,4.5:5,4:4,3.5:3,3:2,2.5:1,2:0}[stars];
 return{day:G.day,rid:G.active,rest:rn,critic:c.critic.n,paper:c.critic.p,stars,headline,quote,boost:boost==null?-2:boost,dishes:L.map(l=>({d:l.d,done:l.done,rar:l.rar,q:l.q}))}}
function showReview(rv,done){
 const st='★'.repeat(Math.floor(rv.stars))+(rv.stars%1?'½':'')+'<span style="color:#b9ab8c">'+'★'.repeat(5-Math.ceil(rv.stars))+'</span>';

 const o=[];
 const nm=Math.random()<(rid==='stand'?.85:.95)?(Math.random()<(rid==='stand'?.15:.3)?2:1):0;
 for(let i=0;i<nm;i++)o.push(pickW(mains));
 if(sides.length&&Math.random()<(rid==='stand'?.6:.35))o.push(pickW(sides));

function freeSlot(){const used=new Set(R.customers.filter(c=>c.slot>=0).map(c=>c.slot));for(let i=0;i<R.E.slots;i++)if(!used.has(i))return i;return -1}

function spawn(a){

 let critic=null;if(a.critic){critic=CRITICS[Math.floor(rs.days/7)%CRITICS.length]}

 if(a.tut)order=['plain','chips'];
 else if(reg)order=reg.order(R.rid);

 else order=genOrder();
 order=order.filter(Boolean);if(!order.length)return null;
 let pat=d.patience*R.E.patience*(reg?reg.pat:critic?1.1:rand(.85,1.15));if(rs.days===0)pat*=1.6;
 const c={id:++R.cid,name:reg?reg.n:critic?critic.n:pick(NAMES),look:reg?LOOKS[reg.id]:critic?LOOKS[critic.look]:randLook(),reg:reg?reg.id:null,critic,tut:!!a.tut,
  order:order.map(x=>({d:x,done:false})),pat,maxP:pat,state:'walk',slot:-1,queued:false,qt:0,paid:0,qs:[],say:null,sayT:0,wt:0,mood:1,dir:0};
 const sl=freeSlot();
 if(sl>=0){c.slot=sl;Object.assign(c,a.from||spawnPos(false))}
 else if(queued().length<R.E.queue){c.queued=true;c.qt=R.t;Object.assign(c,a.from||spawnPos(true))}
 else{if(a.from)return null;Object.assign(c,spawnPos(true));c.state='leave';c.mood=-1;c.say='Too busy!';c.sayT=2;R.ds.lost++;if(critic){R.review=makeReview(c,true)}}
 R.customers.push(c);
 if(reg&&!rs.met[reg.id]){rs.met[reg.id]=true;toast(`⭐ New regular: <b>${reg.n}</b> — they're in your Notebook (☰ Menu).`,'#ffd34d')}
 if(critic&&c.state!=='leave')toast(`🧐 <b>${critic.n}</b> from <i>${critic.p}</i> has arrived. Make it perfect!`,'#ff5fb0');

function leave(c,angry){

 if(angry){c.mood=-2;c.say=pick(['Too slow!','Forget it!','Ugh, I\'m off.','I\'m not waiting!']);c.sayT=2.5;R.ds.walked++;G.stats.walked++;

function updateCustomers(dt){
 for(const c of R.customers){
  c.sayT-=dt;
  let tgt=null;
  if(c.state==='leave')tgt=exitPos(c);
  else if(c.slot>=0)tgt=slotPos(c.slot);
  else if(c.queued){const q=queued();tgt=queuePos(q.indexOf(c))}
  if(tgt){const dx=tgt.x-c.x,dy=tgt.y-c.y,dist=Math.hypot(dx,dy),sp=(c.state==='leave'?300:250)*(R.rid==='stand'?1:.7)*dt;
   if(dist>2){const k=Math.min(1,sp/dist);c.x+=dx*k;c.y+=dy*k;c.s+=(tgt.s-c.s)*Math.min(1,k*1.2);c.wt+=dt*10;if(Math.abs(dx)>Math.abs(dy)*.4)c.dir=Math.sign(dx)}
   else{c.x=tgt.x;c.y=tgt.y;c.s=tgt.s;if(c.state==='walk'&&c.slot>=0)c.state='wait';c.wt=0;c.dir=(c.queued&&R.rid==='stand')?-1:0}}
  if(c.state==='wait'&&!c.tut){c.pat-=dt;if(c.pat<=0)leave(c,true)}
  else if(c.queued&&c.state!=='leave'){c.pat-=dt*.35;if(c.pat<=0)leave(c,true)}
  if(c.state!=='leave'){const f=c.pat/c.maxP;c.mood=f>.5?1:f>.25?0:-1}
 }
 R.customers=R.customers.filter(c=>!(c.state==='leave'&&(R.rid==='stand'?(c.x<-100||c.x>1380):Math.hypot(c.x-1196,c.y-236)<4)));

}

 if(tip>0){R.ds.tips+=tip;G.money+=tip;G.stats.earned+=tip;const p=custHead(c);float(p.x+30,p.y-50,'tip '+money(tip),'#ffd34d',16)}

function isBase(l){return unlockedDishes(R.rid).some(id=>DISHES[id].L&&DISHES[id].L[0]===l)}
function boardAccepts(l){if(!R.board.length)return isBase(l);const b0=R.board[0].l;return unlockedDishes(R.rid).some(id=>DISHES[id].L&&DISHES[id].L[0]===b0&&DISHES[id].L.includes(l))}

function workerCap(w){const d=D(),E=R.E;if(w.zone==='A')return Math.max(1,E[d.cookA]);if(w.zone==='B')return Math.max(1,E[d.cookB]);if(w.zone==='drinks')return 2;return 1}
function updateWorkers(dt){

 for(const w of d.workers){if(!rs.upg[w.id])continue;const s=R.wk[w.id]||(R.wk[w.id]={jobs:[],cd:0,flash:0});
  if(s.flash)s.flash=Math.max(0,s.flash-dt);
  if(w.role==='serve'){s.cd-=dt;if(s.cd<=0&&canCook()){s.cd=.9;for(const c of R.customers){if((c.state==='wait'||(c.state==='walk'&&c.slot>=0))&&autoServe(c)){s.flash=.5;break}}}continue}
  for(const j of s.jobs){j.t+=dt;if(j.t>=j.time&&!j.done){
    if(j.comp){if(R.warmer.length<R.E.warmerCap){R.warmer.push({type:j.comp,q:j.q});j.done=true}}

  const dm=demand();
  if(w.role==='comp'){
   let need=0;for(const id in dm){if(dm[id]>0&&DISHES[id].L)need+=dm[id]*DISHES[id].L.filter(l=>l===w.comp).length}
   const inJobs=s.jobs.filter(j=>j.comp===w.comp).length;
   need-=R.warmer.filter(x=>x.type===w.comp).length+inJobs+R.A.filter(x=>x&&COOK[x.item].comp===w.comp).length;
   if(need>0&&R.warmer.length+inJobs<R.E.warmerCap){s.jobs.push({comp:w.comp,time:w.time*(R.E.xgrillT||1),q:clamp(rand(58,85)+R.E.staffQ,0,100),t:0});addSupply(.6)}
   continue}
  let bestId=null,bestN=0;
  for(const id of w.makes){if(!dishOK(id,R.rid))continue;const n=dm[id]||0;if(n<=0)continue;
   if(w.needs){const np=DISHES[id].L.filter(l=>l===w.needs).length;if(R.warmer.filter(x=>x.type===w.needs).length<np)continue}
   if(n>bestN){bestN=n;bestId=id}}
  if(bestId){let q=clamp(rand(55,82)+R.E.staffQ,0,100);
   if(w.needs){const np=DISHES[bestId].L.filter(l=>l===w.needs).length,qs=[];for(let k=0;k<np;k++){const idx=R.warmer.findIndex(x=>x.type===w.needs);qs.push(R.warmer[idx].q);R.warmer.splice(idx,1)}q=clamp(avg(qs)*.6+q*.4,0,100);addSupply(dishCost(bestId)-.6*np)}
   else addSupply(dishCost(bestId));
   const st=w.zone==='B'?d.cookB:w.zone==='A'?d.cookA:null;
   s.jobs.push({dish:bestId,time:w.time*(st?(R.E['x'+st+'T']||1):1),q,t:0})}
 }}

let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 try{
 X.setTransform(K*DPR,0,0,K*DPR,0,0);hits=[];

function toLogical(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/K,y:(e.clientY-r.top)/K}}
function runHits(p){for(let i=hits.length-1;i>=0;i--){const h=hits[i];if(p.x>=h.x&&p.x<=h.x+h.w&&p.y>=h.y&&p.y<=h.y+h.h){h.fn();return true}}return false}
let downPos=null,grabbed=false;
cv.addEventListener('pointerdown',e=>{const p=toLogical(e);mouse.x=p.x;mouse.y=p.y;if(!G||!R||isPaused())return;
 if(e.button===2){cancelHand();return}
 const before=R.hand;downPos=p;runHits(p);grabbed=!before&&!!R.hand;e.preventDefault()});
addEventListener('pointerup',e=>{if(R&&R.pour)R.pour=null;if(!R||!downPos){downPos=null;return}const p=toLogical(e);
 if(grabbed&&R.hand&&!isPaused()&&Math.hypot(p.x-downPos.x,p.y-downPos.y)>28){mouse.x=p.x;mouse.y=p.y;runHits(p)}downPos=null;grabbed=false});
cv.addEventListener('pointermove',e=>{const p=toLogical(e);mouse.x=p.x;mouse.y=p.y;let on=false;for(const h of hits)if(p.x>=h.x&&p.x<=h.x+h.w&&p.y>=h.y&&p.y<=h.y+h.h){on=true;break}cv.style.cursor=R&&R.hand?'grabbing':on?'pointer':'default'});

let shopTab='equip';
function reqMet(u,rid){return !u.req||u.req.every(r=>G.rest[rid].upg[r])}
function reqNames(u,rid){const all=[...D(rid).upgrades,...D(rid).workers];return u.req.filter(r=>!G.rest[rid].upg[r]).map(r=>(all.find(x=>x.id===r)||{n:r}).n).join(', ')}
function openShop(){if(!G||G.intro<2)return;shopOpen=true;openModal('<div id="shopIn"></div>',{cls:'shop'});renderShop()}
function tabNew(rid,cat){const rs=G.rest[rid];return allItems(rid).some(u=>u.cat===cat&&stocked(u,rid)&&!rs.seen[u.id]&&!rs.upg[u.id])}
function lockCard(rid,list){const rs=G.rest[rid];const hidden=list.filter(u=>!stocked(u,rid));if(!hidden.length)return '';const tm=hidden.filter(u=>u.day===rs.days+1).length;
 return `<div class="card lock wide"><div class="ic">📦</div><div><div class="nm">${hidden.length} more item${hidden.length>1?'s':''} not in stock yet</div><div class="ds">${tm?`🚚 Next delivery tomorrow: ${tm} new item${tm>1?'s':''} for this aisle.`:'Keep trading — new stock arrives at the Supply Co. every day.'}</div></div></div>`}
function renderShop(){
 const rid=G.active,d=D(),rs=RS();

 for(const[k,l]of CATS)h+=`<button data-tab="${k}" class="${shopTab===k?'on':''}">${l}${k!=='prop'&&tabNew(rid,k)?'<span class="dot"></span>':''}</button>`;

 const buyBtn=(id,price,ok,label='Buy')=>`<button class="bg" data-buy="${id}" ${ok&&G.money>=price&&G.money>=0?'':'disabled'}>${label} · ${money0(price)}</button>`;
 const isNew=u=>!rs.seen[u.id]&&!rs.upg[u.id];
 if(shopTab==='staff'){
  const hired=d.workers.filter(w=>rs.upg[w.id]).length;
  h+=`<div class="card wide"><div class="ic">🤖</div><div style="flex:1"><div class="nm">Help Wanted board</div><div class="ds">Staff work at their own stations whenever customers are waiting. They cook a little less perfectly than you and are paid every evening. Hire the whole crew to fully automate ${esc(rs.name)}.</div><div class="bar"><div style="width:${hired/d.workers.length*100}%"></div></div><div class="ds">${hired}/${d.workers.length} hired</div></div></div>`;
  for(const w of d.workers.filter(w=>stocked(w,rid))){const own=rs.upg[w.id],ok=reqMet(w,rid);h+=`<div class="card ${own?'own':''} ${isNew(w)?'new':''}">${isNew(w)?'<span class="newTag">NEW</span>':''}<div class="ic">${w.ic}</div><div style="flex:1"><div class="nm">${w.n} — ${w.t}</div><div class="ds">${w.d}</div><span class="tag">Wage ${money0(w.wage)}/day</span>${!ok?`<div class="req">Requires: ${reqNames(w,rid)}</div>`:''}<div style="margin-top:6px">${own?'<b style="color:#7dffa0">✓ Hired</b>':buyBtn(w.id,w.p,ok,'Hire')}</div></div></div>`}
  h+=lockCard(rid,d.workers).replace('not in stock yet','looking for work soon').replace('items','people').replace('item','person');
 }else if(shopTab==='prop'){
  if(rid==='stand'){
   h+=`<div class="card wide ${rs.owned?'own':''}"><div class="ic">🏠</div><div style="flex:1"><div class="nm">Buy the Stand from Mr Hargreaves</div><div class="ds">Own ${esc(rs.name)} outright and never pay the ${money0(d.rent)} daily rent again.</div>${rs.owned?'<b style="color:#7dffa0">✓ You own this stand!</b>':`<div class="bar"><div style="width:${clamp(G.money/d.buy*100,0,100)}%"></div></div>${buyBtn('__buy',d.buy,true,'Buy the stand')}`}</div></div>`;
  }
  const tr=G.rest.trattoria,cond=[[G.rest.stand.owned,'Own the street stand'],[allStaff('stand'),'Hire all 5 stand staff (fully automated)'],[G.money>=RDEF.trattoria.buy,`Have ${money0(RDEF.trattoria.buy)}`]];
  h+=`<div class="card wide ${tr.unlocked?'own':''}"><div class="ic">🍕</div><div style="flex:1"><div class="nm">The Old Trattoria, Market Square</div><div class="ds">A proper sit-down restaurant serving pizza and pasta. Once you move in, your automated stand keeps earning passive income every day.</div>`;
  if(tr.unlocked)h+=`<b style="color:#7dffa0">✓ ${esc(tr.name)} is yours!</b> Switch between restaurants from the morning screen.`;
  else{h+=cond.map(([ok,t])=>`<div style="color:${ok?'#7dffa0':'#ff9c8c'}">${ok?'✓':'✗'} ${t}</div>`).join('')+`<div style="margin-top:8px">${buyBtn('__tratt',RDEF.trattoria.buy,cond[0][0]&&cond[1][0],'Buy the Trattoria')}</div>`}

 }else{
  const all=d.upgrades.filter(u=>u.cat===shopTab);

  if(!list.length)h+=`<div class="card wide"><div class="ic">🛒</div><div><div class="nm">Empty shelves</div><div class="ds">Nothing in this aisle yet.</div></div></div>`;
  for(const u of list){const own=rs.upg[u.id],ok=reqMet(u,rid);const tags=u.eff?Object.entries(u.eff).map(([k,v])=>effTag(k,v)).filter(Boolean):[];
   h+=`<div class="card ${own?'own':''} ${isNew(u)?'new':''}">${isNew(u)?'<span class="newTag">NEW</span>':''}<div class="ic">${u.ic}</div><div style="flex:1"><div class="nm">${u.n}</div><div class="ds">${u.d}</div>${tags.map(t=>`<span class="tag">${t}</span>`).join('')}${u.look?'<span class="tag" style="background:#5a3a6e">👁 Visible on your shop</span>':''}${!ok?`<div class="req">Requires: ${reqNames(u,rid)}</div>`:''}<div style="margin-top:6px">${own?'<b style="color:#7dffa0">✓ Owned</b>':buyBtn(u.id,u.p,ok)}</div></div></div>`}
  h+=lockCard(rid,all);
 }
 h+=`</div></div>`;
 $('shopIn').innerHTML=h;
 $('shopX').onclick=closeModal;
 $('shopIn').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{const rs2=RS();for(const u of allItems(rid))if(u.cat===shopTab&&stocked(u,rid))rs2.seen[u.id]=1;shopTab=b.dataset.tab;renderShop()});
 $('shopIn').querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buy(b.dataset.buy));

function effTag(k,v){const m={grill:'+'+v+' burner',fryer:'+'+v+' basket',pot:'+'+v+' pot',oven:'+'+v+' oven shelf',passCap:'+'+v+' ledge space',warmerCap:'+'+v+' warmer space',slots:'+'+v+' served at once',queue:'+'+v+' queue space',ads:'+'+v+' customers/day',hours:'+'+v+' hour',rep:'+reputation',patience:'+'+Math.round(v*100)+'% patience',flyers:'+'+v+' flyers/day',flyerP:'+'+Math.round(v*100)+'% flyer success'};
 if(m[k])return m[k];if(k.startsWith('luck_'))return '+'+Math.round(v*100)+'% '+k.slice(5)+' luck';if(k.startsWith('price_'))return '+'+Math.round(v*100)+'% '+k.slice(6)+' price';if(k[0]==='x')return Math.round((1-v)*100)+'% faster';if(k.endsWith('Win'))return 'wider perfect zone';return null}

  openModal(`<h2>🍕 Name your restaurant</h2><p>The Old Trattoria on Market Square is about to become yours. What will you call it?</p><input type="text" id="tName" maxlength="22" value="Bella Notte" style="width:100%"><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="br" id="tCan">Cancel</button><button class="bg" id="tOk">Buy for ${money0(RDEF.trattoria.buy)}</button></div>`,{w:560});
  $('tCan').onclick=closeModal;$('tOk').onclick=()=>{const nm=$('tName').value.trim()||'Bella Notte';G.money-=RDEF.trattoria.buy;const tr=G.rest.trattoria;tr.unlocked=true;tr.name=nm;closeModal();
   story([['🍝 A new chapter',`You've bought <b>${esc(nm)}</b>! Pizza and pasta, sit-down tables and bigger orders. Your stand's crew will keep it running — it earns passive income each day.`],['🔁 Switching restaurants','Each morning you can choose where to work. The restaurant you\'re not at earns money on its own. Let\'s head over now!']],()=>{if(R.phase==='morning')switchRest('trattoria');else toast('Finish today first — then pick the Trattoria on the morning screen.')})};return}
 const u=d.upgrades.find(x=>x.id===id)||d.workers.find(x=>x.id===id);if(!u||rs.upg[id]||G.money<u.p||G.money<0||!reqMet(u,rid)||!stocked(u,rid))return;
 G.money-=u.p;rs.upg[id]=true;rs.seen[id]=1;recalc();
 if(id==='flyers')R.flyers+=10;

 if(u.wage)toast(`👋 ${u.n} the ${u.t} has joined the team!`,'#5be37a');else toast(`✔ Bought ${u.n}`,'#5be37a');
 if(allStaff(rid)&&u.wage)toast(`🤖 ${esc(rs.name)} is now fully automated!`,'#ffd34d');
 renderShop()}

const SKEY=n=>'loaded_slot_'+n;
function readSlot(n){try{let s=localStorage.getItem(SKEY(n));if(!s)s=localStorage.getItem('chefsrise_slot_'+n);return s?migrate(JSON.parse(s)):null}catch(e){return null}}
function migrate(d){if(!d||!d.rest)return null;if(!d.v||d.v<2){d.v=2;d.reviews=d.reviews||[];if(d.intro===1)d.intro=0;if(d.intro>=2&&!d.story)d.story={}}
 d.reviews=d.reviews||[];d.story=d.story||{};for(const r in d.rest){d.rest[r].seen=d.rest[r].seen||{};if(d.rest[r].boost===undefined)d.rest[r].boost=null;d.rest[r].repair=d.rest[r].repair||{grill:true,fryer:true,counter:true}}
 if(d.intro>=2)d.story.rent=1;return d}
function saveSlot(n,silent){if(!G)return;G.slot=n;G.saved=Date.now();try{localStorage.setItem(SKEY(n),JSON.stringify(G));if(!silent)toast(`💾 Saved to Slot ${n}${R&&R.phase!=='morning'?' (loading restarts today from opening time)':''}`,'#4ea8ff')}catch(e){toast('Could not save — browser storage is unavailable.','#ff6b6b')}}

function openNotes(v){if(v)notesVer=v;openModal(`<div class="pnHead"><b style="font-size:20px">📜 Patch Notes</b><button class="vt ${notesVer===2?'on':''}" data-v="2">Update 2</button><button class="vt ${notesVer===1?'on':''}" data-v="1">Update 1</button><button class="br" id="pnX" style="margin-left:auto">✕ Close</button></div><div class="pnBody">${notesVer===2?notesU2():notesU1()}</div>`,{cls:'pn'});
 $('pnX').onclick=closeModal;$('modalBox').querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>openNotes(+b.dataset.v))}
function notesU2(){return `
<h1>UPDATE 2 — PICK UP &amp; PLATE UP</h1>
<div class="sub">Loaded · Released 12 November 2026</div>
${im('u2-hero','Carrying a burger to a customer')}
<p>Chef's Rise is now <b class="c-y">Loaded</b>! This update makes the kitchen feel hands-on. You physically carry every ingredient between stations, shop in person at the Supply Co. across the street, and food critics now review you every week. Here's everything that's new.</p>
<h2>📋 Overview</h2>
<div class="ov">
<div class="ovi"><b>🍔 New Name: Loaded</b><br>The game has a new name, logo and app icon.</div>
<div class="ovi"><b>✋ Pick Up &amp; Drop</b><br>Every patty, bun, basket, cup and dish is carried by hand from station to station.</div>
<div class="ovi"><b>🏪 The Supply Co.</b><br>The Shop button is gone — walk into a real shop across the street instead.</div>
<div class="ovi"><b>📦 Daily Deliveries</b><br>Most items are hidden at first, and new stock arrives every day.</div>
<div class="ovi"><b>⚡ Faster Days</b><br>Quiet spells fly by and cooking is quicker, so day 1 no longer drags.</div>
<div class="ovi"><b>📄 Flyers</b><br>Hand flyers to passers-by during quiet moments to bring in extra customers.</div>
<div class="ovi"><b>📰 Food Critics</b><br>A critic visits every week and their newspaper review boosts (or sinks) your advertising.</div>
<div class="ovi"><b>✨ Rarity Glow</b><br>No more pop-ups. Dishes glow in their rarity colour, brighter the rarer they are.</div>
<div class="ovi"><b>🚶 Walking Animations</b><br>People now face the way they walk, with swinging arms and legs.</div>
<div class="ovi"><b>🎬 Opening Cinematic</b><br>The stand's repairs are now a cutscene instead of a shopping list.</div>
<div class="ovi"><b>☰ Menu</b><br>Save, notebook and patch notes now live in one menu at the top right.</div>
<div class="ovi"><b>🌐 Proper Website</b><br>Icons, an installable app and a link preview with the logo for Discord.</div>
</div>

<h2>🍔 New Name: Loaded</h2>
${im('u2-title','The new title screen')}
<ul><li>The game is now called <b class="c-y">Loaded</b>, with a brand-new burger logo on the title screen.</li><li>Your old Chef's Rise saves carry over automatically — just press Play.</li></ul>

<h2>✋ Pick Up &amp; Drop</h2>
${im('u2-pickup','Carrying a cooked patty to the board')}
<p>Nothing finishes in one click any more. You pick things up, carry them, and put them down where they belong. Click to pick up and click to drop, or drag it straight there.</p>
<h3>Burgers</h3>
<ul><li>Pick up a raw patty from the tub → drop it on a burner → click to flip it → <b>pick it up</b> when it's done → drop it on the bun.</li><li>Buns, cheese, lettuce, tomato and bacon are each carried to the board one at a time.</li><li>Putting the top bun on finishes the burger. It then sits on the board, glowing in its rarity, until you pick it up.</li><li>Click the stack with empty hands to take the top layer back off.</li></ul>
<h3>Chips &amp; Drinks</h3>
<ul><li>Carry a basket of potatoes to the fryer, then lift the chips out when they're golden.</li><li>Drinks are now three steps: <b>grab a cup</b>, <b>place it under a nozzle</b>, then <b>hold the lever</b> to pour. Pick the cup up when it's filled to the green lines.</li></ul>
<h3>Serving</h3>
<ul><li>Carry each dish to the customer and click them to hand it over. A ✓ or ✗ shows whether it's on their order.</li><li>Hands full? Park finished food on the <b>serving ledge</b> and pick it up again later.</li><li>Burnt or raw food has to be carried to the new <b>bin</b>.</li><li>Right-click or Esc puts an ingredient back in its tub (and refunds it).</li><li>Valid drop spots light up with a green dashed outline.</li></ul>
<h3>Trattoria</h3>
<ul><li>Pizzas are built on the board, then <b>picked up whole</b> and carried to the oven.</li><li>Cooked spaghetti is lifted from the pot and carried to the board to be sauced.</li></ul>

<h2>🏪 The Supply Co.</h2>
${im('u2-street','The Supply Co. next to the stand')}
<p>The 🛒 Shop button has been removed. Press <b>👁 Street View</b> and you'll find <b>Mill Street Supply Co.</b> on the left. Click the building to go inside. You can also see it across the road from the kitchen hatch.</p>
${im('u2-shop','Inside the Supply Co.')}
<ul><li>Same aisles as before: Equipment, Recipes, Ingredients, Advertising, Shop Design, Business, Staff and Property.</li><li>Staff are hired from the <b>Help Wanted board</b> inside the shop.</li><li>The Notebook has moved to the ☰ Menu.</li></ul>

<h2>📦 Daily Deliveries</h2>
<ul><li>On day 1 the shop only stocks a few items: Cheese Slices, a Third Burner and Potted Plants.</li><li>A new delivery arrives <b>every morning</b>, and most items are hidden until it does.</li><li>New items get a red <b>NEW</b> tag, and each aisle with something new shows a red dot.</li><li>The shop building flashes a <b>NEW!</b> star, the 👁 button shows a counter, and the morning card lists what arrived.</li><li>Each aisle tells you how many items are still to come, and whether some arrive tomorrow.</li><li>The Trattoria has its own delivery schedule.</li></ul>

<h2>⚡ Faster Days</h2>
<p>Day 1 felt slow. I looked at how other cooking games stay snappy: things keep cooking in the background while you do other jobs, there's always something to do, and there's no waiting around for nothing. So:</p>
<ul><li><b>Quiet time:</b> when nobody's at the counter, the clock runs <b>3× faster</b> until the next customer arrives.</li><li>Patties now cook in <b>5s</b> per side (was 6s), chips in <b>7s</b> (was 8s) and pasta in <b>7s</b> (was 8s).</li><li>The clock runs at half speed during the tutorial, so you don't lose half the morning learning.</li><li>Day 1 now has at least <b>6</b> customers, plus the tutorial customer.</li><li>Cheap upgrades arrive in the first few deliveries, so you have something to buy straight away.</li></ul>

<h2>📄 Flyers</h2>
${im('u2-flyers','Handing a flyer to a passer-by')}
<ul><li>People now walk past right in front of the stand. <b>Click one</b> to hand them a flyer.</li><li>About 1 in 3 will turn around and join the queue. A better reputation and a daily special both help.</li><li>You get <b>10 flyers a day</b>, shown as 📄 at the top.</li><li>The old Flyers upgrade is now <b>Glossy Flyers</b>: +10 flyers a day and a better chance people say yes.</li><li>The day-end summary shows how many flyers you handed out and how many customers they brought in.</li></ul>

<h2>📰 Food Critics &amp; Reviews</h2>
${im('u2-critic','A newspaper review')}
<p>The random Food Critic Fran has been replaced by a proper weekly critic system.</p>
<ul><li>A critic visits on <b>every 7th day</b> of trading. The morning card warns you that one's rumoured to be coming.</li><li>Four critics take turns: <b>Fran Fairweather</b> (The Daily Bite), <b>Rex Ramsbottom</b> (Gourmet Gazette), <b>Ada Okafor</b> (Street Eats Weekly) and <b>Hugo Pemberton</b> (The Mill Street Times).</li><li>They carry a notepad and order your best main, a side and your best drink.</li><li>Each dish is scored on its <b>quality</b> and <b>rarity</b>. Slow service loses points, and dishes that never arrive are scored very low.</li><li>The next morning their review is printed in the paper, from ½★ to 5★.</li><li><b>Reviews work as advertising:</b> 5★ gives <b>+6 customers a day</b> for a week, 4★ gives +4 and 3★ gives +2. 1½★ or worse gives <b>−2</b>.</li><li>Every review is kept in <b>Press Clippings</b> in the Notebook.</li></ul>

<h2>✨ Rarity Glow</h2>
${im('u2-glow','Dishes glowing by rarity on the ledge')}
<ul><li>The full-screen reveal has been <b>removed</b>.</li><li>Every dish above Common now glows in its rarity colour, wherever it is: on the board, on the ledge or in your hand.</li><li>Higher tiers glow brighter and bigger. <span style="color:#bb66ff">Epic</span> and above get spinning light rays, <span style="color:#ff5fb0">Mythic</span> adds orbiting sparkles, and <span style="color:#5ff1ff">Divine</span> sparkles shift through every colour.</li><li>Making a rarity for the first time now shows a small notification and a burst of stars instead.</li></ul>

<h2>🚶 Walking Animations</h2>
${im('u2-walk','Customers walking in profile')}
<ul><li>Customers, passers-by and characters in cutscenes now turn sideways and face the direction they're walking.</li><li>Arms and legs swing as they walk.</li><li>People in the queue face the counter, and customers turn to face you when they reach it.</li></ul>

<h2>🎬 Opening Cinematic</h2>
${im('u2-cine','The opening cinematic')}
<ul><li>New games now open with a <b>cutscene</b> instead of buying the repairs.</li><li>You walk up Mill Street and Mr Hargreaves explains the rent. Then you get to work: the boards fly off, the sign is straightened, the grill roars into life, and it ends with a <b>Grand Opening</b>.</li><li>You can skip it at any time with the button in the top right.</li></ul>

<h2>☰ Menu</h2>
${im('u2-menu','The new menu')}
<ul><li>The Save and Patch Notes buttons have moved into <b>☰ Menu</b> at the top right.</li><li>The menu has: Save, Save to another slot, Export save code, Notebook, Patch notes, How to play and Save &amp; quit.</li><li>The top bar is now just the time, flyers, money, reputation, 👁 Street View, ⏩ speed and ☰ Menu.</li></ul>

<h2>🌐 Proper Website</h2>
<ul><li>New app icon and favicon in browser tabs.</li><li>Sharing the link on <b>Discord</b> (or anywhere else) shows a preview card with the Loaded logo.</li><li>The game can be <b>installed</b> to your phone or computer like an app ("Add to Home Screen" / Install), and works offline once loaded.</li><li>The font is now bundled with the game, so it always looks right.</li><li>On a phone held upright, you'll be asked to turn it sideways.</li></ul>

<h2>➕ Other Changes</h2>
<ul>
<li>Flipping a patty now plays a little flip animation.</li>
<li>Your landlord's rent speech is now part of the opening cutscene.</li>
<li>The serving ledge has a proper bin with a lid that opens.</li>
<li>The assembly board's "Serve" button has been replaced by a "Clear board" button.</li>
<li>Critics have a pink order bubble so you can spot them.</li>
<li>The Food Critic Fran regular has been removed (she's now one of the weekly critics).</li>
<li>Saves now use their own storage key, so they won't clash with other games on the same site.</li>
</ul>
<p class="note">Thanks for playing Loaded! Next up: the next restaurant is still under construction…</p>`}
function notesU1(){return `

<div class="sub">Released 12 November 2026 · when the game was called Chef's Rise</div>
${im('u1-hero','A busy lunch rush at the stand')}
<p>Welcome to the very first update! You start with a broken-down burger stand, £50 and a dream. Cook every burger by hand, chase rare dishes, keep the queue happy and grow from a street stand into a proper restaurant.</p>
<h2>📋 Overview</h2>

<div class="ovi"><b>✨ Dish Rarities</b><br>Every dish rolls a rarity from <span style="color:#c8cdd5">Common</span> to <span style="color:#5ff1ff">Divine</span>, with a huge reveal the first time.</div>

<div class="ovi"><b>🎨 Shop Makeovers &amp; Street View</b><br>Design upgrades visibly change your stand — step outside with Street View to admire it.</div>
<div class="ovi"><b>🤖 Staff &amp; Automation</b><br>Hire a crew who cook and serve for you until the stand runs itself.</div>
<div class="ovi"><b>🍕 The Trattoria</b><br>Automate the stand to buy a sit-down restaurant serving pizza and pasta.</div>
<div class="ovi"><b>💾 Save Slots</b><br>Three save slots, nightly autosave and portable save codes.</div>
<div class="ovi"><b>📜 Patch Notes</b><br>Every update gets its own notes here.</div>
</div>
<h2>🍳 Hands-on Cooking</h2>
${im('u1-cooking','The grill, board and fryer')}

<h2>✨ Dish Rarities</h2>
${im('u1-rarity','A new rarity reveal')}
<ul><li><span style="color:#c8cdd5">Common</span> ×1 · <span style="color:#5be37a">Uncommon</span> ×1.3 · <span style="color:#4ea8ff">Rare</span> ×1.7 · <span style="color:#bb66ff">Epic</span> ×2.4 · <span style="color:#ffb12e">Legendary</span> ×3.5 · <span style="color:#ff5fb0">Mythic</span> ×5 · <span style="color:#5ff1ff">Divine</span> ×8</li><li>Perfect cooking and better ingredients raise your odds. Your first of each rarity got a full-screen reveal.</li></ul>
<h2>🧍 Customers &amp; Regulars</h2>
${im('u1-customers','Customers with their orders')}
<ul><li>Open 8am–6pm with at least 5 customers a day and a lunch rush. Each customer has a patience bar.</li><li>Regulars: Gran Edna, Builder Bob, Office Olly, Student Sam, Night-Owl Nina and Food Critic Fran.</li></ul>
<h2>🏚️ Story, Repairs &amp; Rent</h2>
${im('u1-broken','The broken stand on day one')}
<ul><li>Spend your last £50 fixing the grill, the fryer and the counter. Rent is £15 a night until you buy the stand for £2,000.</li></ul>
<h2>🛒 The Shop</h2>
${im('u1-shop','The shop')}
<ul><li>Equipment, recipes, quality ingredients, advertising (up to a TV advert), longer opening hours and a Daily Special Board.</li></ul>

<h2>🤖 Staff &amp; Automation</h2>

<ul><li>Three save slots, autosave every night, plus export and import save codes.</li></ul>`}
